<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div tag example</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        #nav{
            background-color: yellowgreen;
            display: flex;
            height: 80px;
            justify-content: space-around;
            align-items: center;
        }

        ul{
            display: flex;
            gap: 20px;
        }

        li{
            list-style: none;
            font-size: 18px;
            text-transform: capitalize;
            cursor: pointer;
            letter-spacing: 2px;
            font-weight: bold;
        }

        #main{
            height: 250px;
            background-color:#f8bdbd;
            color:black;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 10px
        }

        #section{
            height: calc(100vh - 330px);
            background-color:#a6bae4;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .card{
            height: 200px;
            width: 300px;
            background-color: rgb(230, 229, 228);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            box-shadow: 0px 4px 5px grey;
            
        }
    </style>
</head>
<body>
    
    <div id="nav">
        <h2>My Logo</h2>

        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </div>

    <div id="main">
        <h1>Welcome to my application</h1>
        <p>Here you will get 20% discount </p>
        <button>Shop Now</button>
    </div>

    <div id="section">

        <div class="card">
            <h3>Hi I'm card1</h3>

        </div>
        <div class="card">
            <h3>Hi I'm card2</h3>

        </div>
        <div class="card">
            <h3>Hi I'm card3</h3>

        </div>

    </div>

</body>
</html>
