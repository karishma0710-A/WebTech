<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframe tag</title>
</head>
<body>
    <h1>add any pages from outside sources</h1>
    <iframe src="https://en.wikipedia.org/wiki/Captain_America" frameborder="1" height="500" width="800"></iframe>
    
    <h1>adding our own content page we have created</h1>
    <iframe src="./marquee.html" frameborder="0" height="500" width="1000"></iframe>

    <h1>Embedding a Google Map</h1>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3912.1129428927584!2d76.90783297966622!3d11.326454760128112!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ba8ebfbfcb99781%3A0x341d8f5b6cb2817b!2sBlack%20Thunder%20Water%20Theme%20Park!5e0!3m2!1sen!2sin!4v1780125887788!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

    <h1>embedding an youtube video</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/xh7IBWb0Ua8?si=v_DRTgi3NaBNVScQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</body>
</html>
