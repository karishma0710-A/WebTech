<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
</head>
<body>
    <h1>Student Form</h1>

    <form action="">

        <fieldset>
            <legend>Student Form</legend>

            <label for="sname">Student Name</label>
            <input type="text" placeholder="Enter Your name" id="sname" name="stuname" required><br><br>
    
            <label for="Pno">Phone Number</label>
            <input type="tel" placeholder="Enter Phone NUmber " id="Pno" name="phno" maxlength="10" readonly><br><br>
    
            <label for="pwd">Password</label>
            <input type="password" placeholder="Password" id="pwd" name="pswd" minlength="5">
            <br><br>
    
            <label for="age">Age</label>
            <input type="text" placeholder="Enter Your Age" id="age" name="stuage"><br><br>

            <label for="stuemail">Student Email</label>
            <input type="email" placeholder="email" id="stumail" value="abc@gmail.com" ><br><br>

            <label for="">Subjects</label><br>
            <label for="sub1">HTML</label>
            <input type="checkbox" name="html" id="sub1" value="html">
            <label for="sub2">CSS</label>
            <input type="checkbox" name="css" id="sub2" value="Css">
            <label for="sub3">JS</label>
            <input type="checkbox" name="JS" id="sub3" value="Js"><br><br>

            <label for="">Select Gender</label><br>
            <label for="Gen1">Male</label>
            <input type="radio" name="male" id="Gen1" value="Male">
            <label for="Gen2">Female</label>
            <input type="radio" name="male" id="Gen2" value="Female">
            <label for="Gen3">Others</label>
            <input type="radio" name="male" id="Gen3" value="Others"><br><br>

            <label for="adrss">Address</label><br>
            <textarea name="stuAddress" id="adrss" placeholder="Enter your address here" value="address" rows="10" cols="40"></textarea><br><br>
            
            <label for="">Select Your Course</label><br><br>
            <select name="Jfs" id="" >
                <option value="" ></option>
                <option value="jfs" name="Jfs">Java Fullstack</option>
                <option value="python" name="Jfs">Python Fullstack</option>
                <option value="MS" name="Jfs">Mernstack</option>
            </select><br><br>

            <label for="">Enter Your DOB</label>
            <input type="date" name="" id=""><br><br>

            <button type="reset">Reset</button>
            <button disabled="disabled">disable</button>



            <button>Register</button>
            
        </fieldset>
    
    </form>

</body>
</html>
