<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multimedia tags</title>
  </head>
  <body>
    <h1>How to add audio</h1>
    <audio controls>
      <source
        src="./Assets/Karuppu - Karuppa Kooda Va Song.mp3"
        type="audio"
        controls
        loop
        autoplay
        muted
      />
    </audio>

    <h2>How to add video</h2>
    <video width="320" height="240" controls>
      <source
        src="./Assets/Angular Project Introduction.mp4"
        type="video/mp4"
        controls
        loop
        autoplay
        muted poster="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-5HNrvA145f8wTMntiNfp7S_YhpiiEmDVEQ&s" >
    </video>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/neOasLBWoy0?si=sW7ZBAEgay6Mfd3-" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>


  </body>
</html>
